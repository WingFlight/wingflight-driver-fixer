name: Driver Fixer PR Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-driver-fixer:
    name: Build PR (windows-${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            py_arch: x64
          - arch: x86
            py_arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build variables (PR version)
        shell: bash
        run: |
          PR_NUMBER='${{ github.event.pull_request.number }}'
          echo "GIT_VER=PR-${PR_NUMBER}" >> $GITHUB_ENV
          echo "ARCH_NAME=${{ matrix.arch }}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.py_arch }}
          cache: 'pip'
          cache-dependency-path: src/requirements_driver_fixer.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements_driver_fixer.txt pyinstaller

      - name: Generate version info
        run: python src/gen_version_info.py
        env:
          FIXER_VERSION: ${{ env.GIT_VER }}

      - name: Build driver fixer
        working-directory: src
        run: |
          python -m PyInstaller --onefile --noupx driver_fixer_gui.py --name wingflight-driver-fixer --windowed --uac-admin --version-file version_info.txt --icon icon.ico --add-data "drivers;drivers" --add-data "logo.png;."

      - name: Package driver fixer
        shell: pwsh
        run: |
          $artName = "wingflight-driver-fixer-$env:GIT_VER-windows-$env:ARCH_NAME.zip"
          $artPath = "dist\$artName"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "src\dist\wingflight-driver-fixer.exe" -DestinationPath $artPath -Force
          "ART_NAME=$artName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ART_PATH=$artPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload driver fixer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_NAME }}
          path: ${{ env.ART_PATH }}
          if-no-files-found: error
